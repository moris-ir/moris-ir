<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Name}} — MORIS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#273d70,#0b1020 45%,#070a12);font-family:system-ui,sans-serif;color:#f7f9ff}.card{width:min(700px,100%);padding:34px;border-radius:30px;background:rgba(16,24,43,.86);border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 100px #0008;backdrop-filter:blur(20px)}.logo{font-size:30px;width:68px;height:68px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,#7657ff,#23d6ff);margin-bottom:24px}h1{font-size:clamp(22px,5vw,36px);overflow-wrap:anywhere;margin:0 0 12px}.meta{color:#a9b5cf;margin-bottom:28px}.btn{display:inline-flex;padding:15px 22px;border-radius:16px;text-decoration:none;font-weight:800;background:#fff;color:#111827}.note{margin-top:24px;color:#7f8baa;font-size:13px}
</style></head><body><main class=card><div class=logo>⚡</div><h1>{{.Name}}</h1><div class=meta>📦 {{.Size}} · MORIS File Service</div><a class=btn href="{{.URL}}">⬇️ دانلود مستقیم</a><div class=note>لینک اختصاصی فایل MORIS</div></main></body></html>
