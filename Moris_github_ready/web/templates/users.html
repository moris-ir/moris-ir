<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MORIS • Users</title><style>body{margin:0;background:#070912;color:#f5f7fb;font-family:system-ui;background:radial-gradient(circle at 80% 0,#172344,transparent 32%)}.wrap{max-width:1250px;margin:auto;padding:28px}.panel{background:#0e1421e8;border:1px solid #ffffff10;border-radius:26px;overflow:hidden;box-shadow:0 30px 100px #0008}.head{padding:24px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0}.muted{color:#8e9ab2}a{color:#73d7ff;text-decoration:none}table{width:100%;border-collapse:collapse}th,td{padding:15px;border-bottom:1px solid #ffffff09;text-align:right}th{color:#8e9ab2;font-size:12px}@media(max-width:600px){.wrap{padding:14px}.head{align-items:start;gap:10px;flex-direction:column}}</style></head><body><div class="wrap"><div class="panel"><div class="head"><div><h1>کاربران MORIS</h1><div class="muted">فعالیت و مصرف کاربران Telegram</div></div><a href="/admin">← داشبورد</a></div><div style="overflow:auto"><table><thead><tr><th>شناسه</th><th>Username</th><th>نام</th><th>آپلود</th><th>حجم</th><th>آخرین فعالیت</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">در حال بارگذاری...</td></tr></tbody></table></div></div></div><script>fetch('/admin/users?json=1').then(r=>r.json()).then(a=>{document.getElementById('rows').innerHTML=a.map(u=>`<tr><td>${u.UserID}</td><td>${u.Username?'@'+u.Username:'-'}</td><td>${u.FirstName||'-'}</td><td>${u.Uploads}</td><td>${fmt(u.Bytes)}</td><td>${new Date(u.LastSeen).toLocaleString('fa-IR')}</td></tr>`).join('')||'<tr><td colspan="6">کاربری وجود ندارد.</td></tr>'}).catch(()=>{}) ;function fmt(n){if(n<1024)return n+' B';let v=n,u=['KB','MB','GB','TB'];for(let x of u){v/=1024;if(v<1024)return v.toFixed(2)+' '+x}return v.toFixed(2)+' PB'}</script></body></html>
